name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: F, keep: "", ascii: false }
          - { variant: G, keep: "", ascii: true }
          - { variant: H, keep: "expo-notifications", ascii: true }
          - { variant: I, keep: "expo-location,expo-task-manager,expo-sensors,@react-native-async-storage/async-storage,react-native-svg", ascii: true }
          - { variant: J, keep: "expo-dev-client", ascii: true }
    defaults:
      run:
        working-directory: stepcounter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stepcounter/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Configure variant
        env:
          KEEP: ${{ matrix.keep }}
          ASCII: ${{ matrix.ascii }}
        run: |
          node -e "
          const fs=require('fs');
          const keep=(process.env.KEEP||'').split(',').filter(Boolean);
          const extra=['expo-notifications','expo-location','expo-task-manager','expo-sensors','expo-dev-client','react-native-svg','@react-native-async-storage/async-storage'];
          const p=JSON.parse(fs.readFileSync('package.json'));
          for(const e of extra) if(!keep.includes(e)) delete p.dependencies[e];
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          const a=JSON.parse(fs.readFileSync('app.json'));
          a.expo.plugins=a.expo.plugins.filter(x=>keep.includes(Array.isArray(x)?x[0]:x));
          a.expo.newArchEnabled=false;
          if(process.env.ASCII==='true') a.expo.name='StepCounter';
          fs.writeFileSync('app.json',JSON.stringify(a,null,2));"
          cat > index.js <<'JS'
          import React from 'react';
          import { Text, View } from 'react-native';
          import { registerRootComponent } from 'expo';
          registerRootComponent(() => (
            <View style={{ flex: 1, justifyContent: 'center', alignItems: 'center', backgroundColor: '#0B1217' }}>
              <Text style={{ color: '#5EEAD4', fontSize: 26 }}>Запуск работает</Text>
            </View>
          ));
          JS
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: stepcounter/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shagomer-${{ matrix.variant }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ matrix.variant }}
          name: Шагомер, сборка ${{ github.run_number }}, вариант ${{ matrix.variant }}
          files: stepcounter/shagomer-${{ matrix.variant }}.apk
