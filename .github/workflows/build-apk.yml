name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stepcounter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stepcounter/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: stepcounter/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: shagomer-apk
          path: stepcounter/android/app/build/outputs/apk/release/app-release.apk
